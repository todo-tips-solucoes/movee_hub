<title>Protótipo Adiantamento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<style>
/* Tokens: EntreGô 2.0 como estão em frontend_v2/app/globals.css (valores AA do hub). */
:root {
  --bg: #f9f2e8;
  --fg: #0f1849;
  --card: #ffffff;
  --muted: #efe6d6;
  --muted-fg: #52618a;
  --border: #e7ddcd;
  --input: #d9cdb8;
  --primary: #2c66e9;
  --primary-fg: #ffffff;
  --secondary: #b4e4ff;
  --secondary-fg: #1b3fac;
  --accent: #b4ffed;
  --accent-fg: #0f4938;
  --mint: #2ceabc;
  --ok: #00715e;
  --ok-bg: #dcefe8;
  --warn: #ffb72a;
  --warn-text: #92400e;
  --warn-bg: #fff1d6;
  --bad: #c62828;
  --bad-bg: #fbe3df;
  --info-bg: #e3ebfc;
  --chrome: #f3ece0;
  --bezel: #0f1849;
  --shadow: 0 1px 2px rgb(15 24 73 / 0.06), 0 8px 24px -12px rgb(15 24 73 / 0.18);
  --radius: 0.875rem;
  --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1130; --fg: #e9eefb; --card: #141d44; --muted: #16204a; --muted-fg: #9aa8cf;
    --border: #1e2a52; --input: #283566; --primary: #5b8df2; --primary-fg: #07112e;
    --secondary: #1b2a55; --secondary-fg: #b9d2ff; --accent: #173a44; --accent-fg: #2ceabc;
    --ok: #2ceabc; --ok-bg: #123a3a; --warn: #ffc555; --warn-text: #ffc555; --warn-bg: #3a2f14;
    --bad: #ff6b6b; --bad-bg: #3d1a26; --info-bg: #1b2a55; --chrome: #0e1838; --bezel: #26336b;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -12px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1130; --fg: #e9eefb; --card: #141d44; --muted: #16204a; --muted-fg: #9aa8cf;
  --border: #1e2a52; --input: #283566; --primary: #5b8df2; --primary-fg: #07112e;
  --secondary: #1b2a55; --secondary-fg: #b9d2ff; --accent: #173a44; --accent-fg: #2ceabc;
  --ok: #2ceabc; --ok-bg: #123a3a; --warn: #ffc555; --warn-text: #ffc555; --warn-bg: #3a2f14;
  --bad: #ff6b6b; --bad-bg: #3d1a26; --info-bg: #1b2a55; --chrome: #0e1838; --bezel: #26336b;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px -12px rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: "FILL" 0, "wght" 400; flex: none; }
.ms.fill { font-variation-settings: "FILL" 1, "wght" 400; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted-fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Visor ---------- */
.viewer { display: grid; grid-template-columns: 17rem 1fr; min-height: 100%; }
.index { background: var(--chrome); border-right: 1px solid var(--border); padding: 1.25rem 1rem 2rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.index h1 { font-size: 1.05rem; font-weight: 800; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.index .lead { margin: 0.35rem 0 1rem; color: var(--muted-fg); font-size: 0.8rem; }
.index h2 { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-fg); margin: 1.1rem 0 0.35rem; font-weight: 700; }
.index a { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.4rem 0.55rem; border-radius: 0.55rem; color: inherit; text-decoration: none; font-size: 0.86rem; }
.index a .mono { color: var(--muted-fg); font-size: 0.72rem; min-width: 2.2rem; }
.index a:hover { background: var(--muted); }
.index a[aria-current="page"] { background: var(--card); box-shadow: var(--shadow); font-weight: 700; }
.index a[aria-current="page"] .mono { color: var(--primary); }
.stage-wrap { min-width: 0; padding: 1.25rem clamp(1rem, 3vw, 2.5rem) 3rem; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; justify-content: space-between; margin-bottom: 1.25rem; }
.topbar .where { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.topbar .where .mono { color: var(--primary); font-weight: 500; }
.topbar h2 { margin: 0; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
.topbar .tools { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
.flag { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; font-weight: 600; padding: 0.3rem 0.6rem; border-radius: 999px; background: var(--warn-bg); color: var(--warn-text); }
.mobile-pick { display: none; }
.stage { display: flex; gap: 2rem; align-items: flex-start; flex-wrap: wrap; }
.notes { flex: 1 1 18rem; max-width: 34rem; }
.notes h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-fg); margin: 0 0 0.5rem; }
.notes ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 0.45rem; }
.notes li { max-width: 62ch; }
.notes .refs { margin-top: 1rem; font-size: 0.8rem; color: var(--muted-fg); }
.navpair { display: flex; gap: 0.5rem; margin-top: 1.25rem; flex-wrap: wrap; }

@media (max-width: 900px) {
  .viewer { grid-template-columns: 1fr; }
  .index { display: none; }
  .mobile-pick { display: block; width: 100%; }
  .mobile-pick select { width: 100%; padding: 0.6rem; border-radius: 0.6rem; border: 1px solid var(--input); background: var(--card); }
}

/* ---------- Primitivos compartilhados ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; min-height: 2.75rem; padding: 0 1rem; border-radius: 0.75rem; border: 1px solid transparent; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; background: var(--primary); color: var(--primary-fg); white-space: nowrap; }
.btn.sm { min-height: 2.25rem; padding: 0 0.75rem; font-size: 0.82rem; border-radius: 0.6rem; }
.btn.block { width: 100%; }
.btn.outline { background: var(--card); color: var(--fg); border-color: var(--input); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.danger { background: var(--bad-bg); color: var(--bad); }
.btn.solid-danger { background: var(--bad); color: #fff; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.5; cursor: not-allowed; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.pad { padding: 1rem; }
.stack { display: grid; gap: 0.75rem; }
.row { display: flex; gap: 0.75rem; align-items: center; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.18rem 0.55rem; border-radius: 999px; font-size: 0.74rem; font-weight: 700; white-space: nowrap; background: var(--muted); color: var(--muted-fg); }
.pill .ms { font-size: 15px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn-text); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--primary); }
.eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted-fg); }
.kv { display: grid; gap: 0.1rem; }
.kv dt { font-size: 0.75rem; color: var(--muted-fg); }
.kv dd { margin: 0; font-weight: 600; }
.lines { display: grid; }
.lines > div { display: flex; justify-content: space-between; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px dashed var(--border); }
.lines > div:last-child { border-bottom: 0; }
.lines .total { font-weight: 800; font-size: 1.05rem; border-top: 1px solid var(--fg); border-bottom: 0; padding-top: 0.6rem; }
.alert { display: flex; gap: 0.6rem; padding: 0.8rem 0.9rem; border-radius: 0.8rem; background: var(--info-bg); }
.alert.warn { background: var(--warn-bg); }
.alert.warn .ms { color: var(--warn-text); }
.alert.bad { background: var(--bad-bg); }
.alert.bad .ms { color: var(--bad); }
.alert.ok { background: var(--ok-bg); }
.alert.ok .ms { color: var(--ok); }
.alert .ms { color: var(--primary); margin-top: 0.1rem; }
.alert p { margin: 0; }
.alert strong { display: block; }
.field { display: grid; gap: 0.3rem; }
.field label, .field .lbl { font-size: 0.8rem; font-weight: 600; }
.field .hint { font-size: 0.75rem; color: var(--muted-fg); }
.input { min-height: 2.75rem; border: 1px solid var(--input); border-radius: 0.7rem; background: var(--card); padding: 0 0.8rem; width: 100%; }
textarea.input { padding: 0.6rem 0.8rem; min-height: 5rem; resize: vertical; }
.check { display: flex; gap: 0.6rem; align-items: flex-start; }
.check input { width: 1.2rem; height: 1.2rem; margin-top: 0.15rem; accent-color: var(--primary); flex: none; }
.chips { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.chip { border: 1px solid var(--input); background: var(--card); border-radius: 999px; padding: 0 0.8rem; min-height: 2.25rem; font-size: 0.8rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.3rem; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 0.7rem; overflow: hidden; }
.seg span { padding: 0.45rem 0.8rem; font-size: 0.8rem; font-weight: 600; }
.seg span[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 1.75rem 1fr; gap: 0.7rem; position: relative; padding-bottom: 0.95rem; }
.tl li:last-child { padding-bottom: 0; }
.tl li::before { content: ""; position: absolute; left: calc(0.875rem - 1px); top: 1.75rem; bottom: 0; width: 2px; background: var(--border); }
.tl li:last-child::before { display: none; }
.tl li.done::before { background: var(--ok); }
.tl .dot { width: 1.75rem; height: 1.75rem; border-radius: 999px; display: grid; place-items: center; background: var(--muted); color: var(--muted-fg); position: relative; }
.tl .dot .ms { font-size: 17px; }
.tl .done .dot { background: var(--ok); color: var(--card); }
.tl .current .dot { background: var(--primary); color: var(--primary-fg); box-shadow: 0 0 0 4px var(--info-bg); }
.tl .fail .dot { background: var(--bad); color: #fff; }
.tl .t { font-weight: 700; line-height: 1.3; }
.tl .s { font-size: 0.78rem; color: var(--muted-fg); }
.tl .todo .t { color: var(--muted-fg); font-weight: 600; }

/* ---------- App do motorista ---------- */
.phone { width: 390px; max-width: 100%; height: 800px; border: 10px solid var(--bezel); border-radius: 44px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); flex: none; position: relative; }
.m-status { display: flex; justify-content: space-between; padding: 0.55rem 1.3rem 0.2rem; font-size: 0.75rem; font-weight: 700; }
.m-status .ms { font-size: 15px; }
.m-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.45rem 1rem 0.6rem; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 85%, transparent); }
.m-head h1 { margin: 0; font-size: 1rem; font-weight: 800; }
.m-head .left { display: flex; align-items: center; gap: 0.35rem; min-width: 0; }
.wordmark { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.03em; color: var(--fg); }
.wordmark b { color: var(--primary); }
.iconbtn { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 0.75rem; border: 0; background: transparent; cursor: pointer; position: relative; }
.m-body { flex: 1; overflow-y: auto; padding: 1rem; display: grid; gap: 0.9rem; align-content: start; }
.m-nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); background: var(--card); padding: 0.3rem 0.25rem 0.6rem; }
.m-nav a { display: grid; justify-items: center; gap: 0.1rem; min-height: 3rem; padding-top: 0.35rem; font-size: 0.68rem; font-weight: 600; color: var(--muted-fg); text-decoration: none; position: relative; }
.m-nav a .ms { font-size: 23px; }
.m-nav a[aria-current="page"] { color: var(--primary); }
.m-nav a[aria-current="page"] .ms { font-variation-settings: "FILL" 1; }
.badge { position: absolute; top: 0.1rem; left: calc(50% + 0.3rem); min-width: 1.1rem; height: 1.1rem; border-radius: 999px; background: var(--bad); color: #fff; font-size: 0.66rem; font-weight: 800; display: grid; place-items: center; padding: 0 0.25rem; }
.hero { border-radius: 1.25rem; padding: 1.1rem; background: linear-gradient(140deg, #1b3fac, #2c66e9 60%, #2f7fe0); color: #fff; }
.hero .eyebrow { color: rgb(255 255 255 / 0.8); }
.hero .big { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.hero .sub { color: rgb(255 255 255 / 0.85); font-size: 0.82rem; }
.hero .btn { background: #fff; color: #1b3fac; }
.hero.paid { background: linear-gradient(140deg, #0b5c4d, #00715e); }
.m-section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; color: var(--muted-fg); margin: 0.2rem 0 -0.35rem; }
.list { display: grid; }
.list > * { display: flex; gap: 0.75rem; align-items: center; padding: 0.8rem 0.9rem; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
.list > *:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 700; line-height: 1.3; }
.list .meta { font-size: 0.76rem; color: var(--muted-fg); }
.icotile { width: 2.4rem; height: 2.4rem; border-radius: 0.75rem; display: grid; place-items: center; background: var(--info-bg); color: var(--primary); flex: none; }
.icotile.ok { background: var(--ok-bg); color: var(--ok); }
.icotile.warn { background: var(--warn-bg); color: var(--warn-text); }
.icotile.bad { background: var(--bad-bg); color: var(--bad); }
.icotile.muted { background: var(--muted); color: var(--muted-fg); }
.unread { position: relative; }
.unread::after { content: ""; width: 0.55rem; height: 0.55rem; border-radius: 999px; background: var(--primary); flex: none; }
.notif-read .title { font-weight: 600; }
.amount { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sheet-backdrop { position: absolute; inset: 0; background: rgb(10 17 48 / 0.45); display: flex; align-items: flex-end; }
.sheet { background: var(--card); width: 100%; border-radius: 1.4rem 1.4rem 0 0; padding: 1rem 1rem 1.2rem; display: grid; gap: 0.8rem; max-height: 88%; overflow-y: auto; }
.sheet .grab { width: 2.5rem; height: 0.3rem; border-radius: 999px; background: var(--input); justify-self: center; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.threecol { display: grid; grid-template-columns: 1.3fr 2fr 0.9fr; gap: 0.6rem; }
.radio-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
.radio-cards label { border: 1px solid var(--input); border-radius: 0.7rem; padding: 0.65rem 0.7rem; display: flex; gap: 0.5rem; align-items: center; font-weight: 600; min-height: 2.75rem; }
.radio-cards label.on { border-color: var(--primary); background: var(--info-bg); }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; }
.days span { text-align: center; padding: 0.35rem 0; border-radius: 0.5rem; font-size: 0.72rem; font-weight: 700; background: var(--ok-bg); color: var(--ok); }
.days span.off { background: var(--muted); color: var(--muted-fg); text-decoration: line-through; }
.days span.today { outline: 2px solid var(--fg); outline-offset: -2px; }

/* ---------- Hub ---------- */
.hub-scroll { width: 100%; overflow-x: auto; border-radius: 0.9rem; box-shadow: var(--shadow); }
.hub { min-width: 1120px; background: var(--bg); border: 1px solid var(--border); border-radius: 0.9rem; overflow: hidden; }
.browser { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.9rem; background: var(--chrome); border-bottom: 1px solid var(--border); }
.browser .dots { display: flex; gap: 0.35rem; }
.browser .dots i { width: 0.65rem; height: 0.65rem; border-radius: 999px; background: var(--input); display: block; }
.browser .url { flex: 1; font-family: var(--mono); font-size: 0.75rem; color: var(--muted-fg); background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.25rem 0.6rem; }
.h-top { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); background: var(--card); }
.h-top .right { display: flex; gap: 0.6rem; align-items: center; }
.entity { display: inline-flex; align-items: center; gap: 0.4rem; border: 1px solid var(--input); border-radius: 0.6rem; padding: 0.3rem 0.6rem; font-size: 0.8rem; font-weight: 600; }
.avatar { width: 2rem; height: 2rem; border-radius: 999px; background: var(--secondary); color: var(--secondary-fg); display: grid; place-items: center; font-weight: 800; font-size: 0.75rem; }
.h-body { display: grid; grid-template-columns: 14rem 1fr; min-height: 640px; }
.h-side { background: var(--chrome); border-right: 1px solid var(--border); padding: 0.8rem 0.6rem; display: grid; gap: 0.1rem; align-content: start; }
.h-side a, .h-side .item { display: flex; gap: 0.6rem; align-items: center; padding: 0.5rem 0.65rem; border-radius: 0.6rem; font-size: 0.85rem; font-weight: 600; color: var(--muted-fg); text-decoration: none; }
.h-side a[aria-current="page"] { background: var(--primary); color: var(--primary-fg); }
.h-side a .ms { font-size: 19px; }
.h-main { padding: 1.25rem 1.5rem 2rem; display: grid; gap: 1rem; align-content: start; min-width: 0; }
.h-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; }
.h-title h1 { margin: 0; font-size: 1.45rem; font-weight: 800; letter-spacing: -0.01em; }
.h-title p { margin: 0.15rem 0 0; color: var(--muted-fg); }
.tabs { display: flex; gap: 0.2rem; border-bottom: 1px solid var(--border); }
.tabs a { padding: 0.55rem 0.8rem; font-weight: 600; font-size: 0.86rem; color: var(--muted-fg); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 0.35rem; align-items: center; }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--primary); }
.tabs .count { background: var(--warn-bg); color: var(--warn-text); border-radius: 999px; padding: 0 0.4rem; font-size: 0.7rem; font-weight: 800; }
.filterbar { display: grid; grid-template-columns: 1.6fr 1.2fr 1fr 1fr 1fr; gap: 0.75rem; align-items: end; padding: 0.9rem; }
.filterbar .actions { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
.select { min-height: 2.25rem; border: 1px solid var(--input); border-radius: 0.6rem; padding: 0 0.7rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; background: var(--card); font-size: 0.84rem; }
.hinput { min-height: 2.25rem; border: 1px solid var(--input); border-radius: 0.6rem; padding: 0 0.7rem; background: var(--card); font-size: 0.84rem; width: 100%; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
caption { text-align: left; padding: 0.75rem 0.9rem; font-weight: 700; }
th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-fg); background: var(--muted); padding: 0.55rem 0.7rem; white-space: nowrap; font-weight: 700; }
td { padding: 0.55rem 0.7rem; border-top: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tr.sel td { background: color-mix(in srgb, var(--primary) 7%, var(--card)); }
tr.pend td { background: color-mix(in srgb, var(--warn) 10%, var(--card)); }

<script>
(() => {
  const I = (n, cls = '') => `<span class="ms ${cls}" aria-hidden="true">${n}</span>`;
  const pill = (kind, icon, text) => `<span class="pill ${kind}">${icon ? I(icon) : ''}${text}</span>`;

  // Estados da solicitação → rótulo que o motorista vê (PLANO §11.1)
  const ST = {
    AGUARDANDO_CORTE: ['info', 'schedule', 'Aguardando fechamento'],
    AGUARDANDO_PRODUCAO: ['warn', 'hourglass_top', 'Aguardando produção'],
    LIBERADA: ['ok', 'task_alt', 'Liberado'],
    EM_LOTE: ['info', 'inventory_2', 'Incluído para pagamento'],
    EXPORTADA: ['info', 'sync', 'Pagamento em processamento'],
    PAGA: ['ok', 'paid', 'Pago'],
    FALHOU: ['bad', 'error', 'Pagamento falhou'],
    REJEITADA: ['bad', 'block', 'Rejeitado'],
    INELEGIVEL: ['', 'remove_circle', 'Não liberado'],
    CANCELADA: ['', 'close', 'Cancelado'],
  };
  const st = (k) => pill(ST[k][0], ST[k][1], ST[k][2]);
  const HST = { ...ST, LIBERADA: ['ok', 'task_alt', 'Liberada'], EXPORTADA: ['info', 'upload_file', 'Exportada'], PAGA: ['ok', 'paid', 'Paga'], REJEITADA: ['bad', 'block', 'Rejeitada'], INELEGIVEL: ['', 'remove_circle', 'Inelegível'], CANCELADA: ['', 'close', 'Cancelada'], EM_LOTE: ['info', 'inventory_2', 'Em lote'] };
  const hst = (k) => pill(HST[k][0], HST[k][1], HST[k][2]);

  const tl = (steps) => `<ol class="tl">${steps.map(([state, t, s]) => {
    const icon = { done: 'check', current: 'more_horiz', todo: 'circle', fail: 'close' }[state];
    return `<li class="${state}"><span class="dot">${I(icon)}</span><div><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div></li>`;
  }).join('')}</ol>`;

  // ---------- Moldura do app ----------
  const navItems = [['home', 'home', 'Início', 'M01'], ['adv', 'payments', 'Adiantamento', 'M03'], ['notif', 'notifications', 'Notificações', 'M02'], ['conta', 'account_balance', 'Conta', 'M12']];
  const phone = ({ title, back, nav, body, overlay = '', clock = '10:24', home = false }) => `
    <div class="phone" role="img" aria-label="Tela do app do motorista: ${title || 'Início'}">
      <div class="m-status"><span class="num">${clock}</span><span>${I('signal_cellular_alt')} ${I('wifi')} ${I('battery_5_bar')}</span></div>
      <header class="m-head">
        <div class="left">
          ${back ? `<a class="iconbtn" href="#${back}" aria-label="Voltar">${I('arrow_back')}</a>` : ''}
          ${home ? `<span class="wordmark">entreg<b>ô</b></span>` : `<h1>${title}</h1>`}
        </div>
        ${home ? `<a class="iconbtn" href="#M02" aria-label="Notificações, 3 não lidas">${I('notifications')}<span class="badge" style="left:1.55rem;top:0.35rem">3</span></a>` : ''}

      <div class="m-body">${body}</div>
      ${nav ? `<nav class="m-nav" aria-label="Navegação do app">${navItems.map(([k, ic, lb, to]) => `<a href="#${to}" ${k === nav ? 'aria-current="page"' : ''}>${I(ic)}${lb}${k === 'notif' ? '<span class="badge">3</span>' : ''}</a>`).join('')}</nav>` : ''}

  const contaMask = `<div class="row"><span class="icotile">${I('account_balance')}</span><div class="grow" style="min-width:0"><div style="font-weight:700">Nu Pagamentos · 260</div><div class="muted num" style="font-size:.8rem">Ag. 0001 · Conta corrente ••••4521-7</div></div></div>`;
  const breakdown = (final) => `
    <div class="lines num">
      <div><span>Produção de quarta, 16/09</span><span>R$ 215,67</span></div>
      <div><span>60% da produção</span><span>R$ 129,40</span></div>
      <div><span>Taxa de transferência</span><span>− R$ 0,35</span></div>

    </div>`;
  const daysRow = (today) => `<div class="days" aria-label="Dias disponíveis: segunda a sábado">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d, i) => `<span class="${i === 0 ? 'off' : ''} ${i === today ? 'today' : ''}" title="${['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'][i]}${i === 0 ? ' (indisponível)' : ''}">${d}</span>`).join('')}</div>`;

  // ---------- Moldura do hub ----------

  const subtabs = [['Solicitações', 'H01', 'sol'], ['Pagamentos', 'H08', 'pag'], ['Contas bancárias', 'H06', 'contas', '1.735'], ['Repasse', 'H14', 'rep'], ['Configurações', 'H03', 'cfg']];
  const hub = ({ path, tab, title, sub, action = '', body }) => `
    <div class="hub-scroll"><div class="hub" role="img" aria-label="Tela do hub: ${title}">
      <div class="browser"><div class="dots"><i></i><i></i><i></i></div><div class="url">app.moveelog.com.br/hub/dashboard/adiantamentos${path}</div></div>
      <div class="h-top">
        <span class="wordmark">entreg<b>ô</b> <span class="muted" style="font-weight:600;font-size:.8rem">Hub de Frota</span></span>
        <div class="right">
          <span class="entity">${I('apartment')} Movee · 6 ${I('expand_more')}</span>
          <span class="avatar">AF</span>
          <span style="font-size:.8rem"><b>Ana Financeiro</b><br><span class="muted">financeiro</span></span>
        </div>
      </div>
      <div class="h-body">
        <nav class="h-side" aria-label="Módulos">${sideMods.map(([ic, lb]) => lb === 'Adiantamentos' ? `<a href="#H01" aria-current="page">${I(ic)}${lb}</a>` : `<span class="item">${I(ic)}${lb}</span>`).join('')}</nav>
        <div class="h-main">
          <div class="h-title"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="row wrap">${action}</div></div>
          <nav class="tabs" aria-label="Seções de Adiantamentos">${subtabs.map(([lb, to, k, c]) => `<a href="#${to}" ${k === tab ? 'aria-current="page"' : ''}>${lb}${c ? `<span class="count">${c}</span>` : ''}</a>`).join('')}</nav>
          ${body}
        </div>
      </div>
    </div></div>`;

  const pager = (txt) => `<div class="pager"><span>${txt}</span><div class="pgs"><span>‹</span><span class="on">1</span><span>2</span><span>3</span><span>…</span><span>11</span><span>›</span></div></div>`;
  const sel = (label, value) => `<div class="field"><span class="lbl">${label}</span><div class="select">${value}${I('expand_more')}</div></div>`;

  const solicRows = [
    ['ADV-000123', 'Joana Ribeiro', '***.***.***-41', '17/09 10:24', '16/09', '215,67', '129,40', '129,05', 'Nu Pagamentos', '••••4521-7', 'AGUARDANDO_CORTE', 'Não exportada', 'Não paga'],
    ['ADV-000122', 'Carlos Menezes', '**.***.***/0001-08', '17/09 09:12', '16/09', '342,10', '205,26', '204,91', 'Inter', '••••0917-3', 'AGUARDANDO_CORTE', 'Não exportada', 'Não paga'],
    ['ADV-000118', 'Priscila Andrade', '**.***.***/0001-55', '16/09 14:51', '15/09', '188,00', '112,80', '112,45', 'Itaú', '••••3310-0', 'PAGA', 'Lote 000121', 'Paga 16/09'],
    ['ADV-000117', 'Renan Tavares', '***.***.***-02', '16/09 13:40', '15/09', '97,35', '58,41', '58,06', 'Caixa', '••••0045-2', 'EXPORTADA', 'Lote 000122', 'Em processamento'],
    ['ADV-000116', 'Luana Prates', '**.***.***/0001-11', '16/09 12:05', '15/09', '—', '—', '—', 'Santander', '••••8801-6', 'AGUARDANDO_PRODUCAO', 'Não exportada', 'Não paga'],
    ['ADV-000115', 'Diego Sampaio', '**.***.***/0001-73', '16/09 11:47', '15/09', '0,00', '0,00', '—', 'PicPay', '••••7712-1', 'INELEGIVEL', '—', '—'],
    ['ADV-000114', 'Marta Queiroz', '***.***.***-90', '16/09 10:02', '15/09', '251,90', '151,14', '150,79', 'Bradesco', '••••6624-4', 'REJEITADA', '—', '—'],
    ['ADV-000112', 'Otávio Lins', '**.***.***/0001-29', '16/09 09:31', '15/09', '120,00', '72,00', '71,65', 'Nubank', '••••2290-5', 'LIBERADA', 'Não exportada', 'Não paga'],
  ];

  const S = [];
  const add = (id, app, title, render, notes, refs) => S.push({ id, app, title, render, notes, refs });

  // =====================================================================
  // APP DO MOTORISTA
  // =====================================================================
  add('M01', 'm', 'Início', () => phone({ home: true, nav: 'home', body: `
    <div><div class="muted" style="font-size:.85rem">Quinta-feira, 17 de setembro</div><div style="font-size:1.35rem;font-weight:800">Olá, Joana</div></div>
    <section class="hero stack" aria-labelledby="h-adv">
      <div class="row between"><span class="eyebrow" id="h-adv">Adiantamento de hoje</span>${pill('ok', 'schedule', 'Aberto até 15:00')}</div>
      <div><div class="sub">Estimativa com a produção de ontem</div><div class="big num">R$ 129,05</div></div>
      <a class="btn block" href="#M03">Ver adiantamento</a>
    </section>
    <p class="m-section-title">Movimento aberto</p>
    <div class="card pad stack">
      <div class="row between"><span class="muted">Valor da nota</span><span class="amount">R$ 1.482,30</span></div>
      <div class="row between"><span class="muted">Período</span><span class="num">07/09 a 13/09</span></div>
      <div class="row between"><span class="muted">Nota fiscal</span>${pill('warn', 'pending', 'Pendente')}</div>
      <a class="btn outline block" href="#M01">${I('upload')}Validar minha NFS-e</a>
    </div>
    <p class="m-section-title">Últimas notificações</p>
    <div class="card list">
      <a href="#M09" class="unread"><span class="icotile ok">${I('paid')}</span><span class="grow"><span class="title">Pagamento realizado</span><br><span class="meta">R$ 129,05 · ontem 17:42</span></span></a>
      <a href="#M02"><span class="icotile muted">${I('notifications')}</span><span class="grow"><span class="title">Ver todas</span></span>${I('chevron_right')}</a>
    </div>` }),
    ['A home continua sendo o movimento aberto; ganha o card do adiantamento do dia e a navegação inferior (hoje o app não tem menu).', 'O card nunca some: mostra “aberto até 15:00”, “encerrado” ou “indisponível hoje” conforme o backend.', 'Badge de não lidas no sino e na aba Notificações vem de GET /motorista/notificacoes/nao-lidas.'],
    'PLANO §19, §23 · D-04, D-15');

  add('M02', 'm', 'Notificações', () => phone({ title: 'Notificações', nav: 'notif', body: `
    <div class="row between wrap"><div class="chips" role="group" aria-label="Filtro">
      <button class="chip" aria-pressed="true" type="button">Todas</button>
      <button class="chip" aria-pressed="false" type="button">Não lidas · 3</button>
      <button class="chip" aria-pressed="false" type="button">Adiantamento</button>
      <button class="chip" aria-pressed="false" type="button">Pagamento</button>
      <button class="chip" aria-pressed="false" type="button">Conta bancária</button>
      <button class="chip" aria-pressed="false" type="button">Avisos</button>
    </div></div>
    <button class="btn ghost sm" type="button" style="justify-self:end">${I('done_all')}Marcar todas como lidas</button>
    <p class="m-section-title">Esta semana</p>
    <div class="card list">
      <a href="#M09" class="unread"><span class="icotile ok">${I('paid')}</span><span class="grow"><span class="title">Pagamento realizado</span><br><span class="meta">R$ 129,05 transferidos para ••••4521-7.</span><br><span class="meta num">16/09/2026 17:42 · Pagamento</span></span></a>
      <a href="#M11" class="unread"><span class="icotile">${I('task_alt')}</span><span class="grow"><span class="title">Adiantamento liberado</span><br><span class="meta">Produção de 15/09 calculada: você recebe R$ 129,05.</span><br><span class="meta num">16/09/2026 15:01 · Adiantamento</span></span></a>
      <a href="#M01" class="unread"><span class="icotile warn">${I('campaign')}</span><span class="grow"><span class="title">Mudança no ponto de coleta</span><br><span class="meta">A partir de segunda, a coleta do turno da manhã…</span><br><span class="meta num">15/09/2026 08:30 · Aviso</span></span></a>
      <a href="#M12" class="notif-read"><span class="icotile ok">${I('account_balance')}</span><span class="grow"><span class="title">Conta bancária aprovada</span><br><span class="meta">Seus próximos pagamentos vão para ••••4521-7.</span><br><span class="meta num">12/09/2026 10:15 · Conta bancária</span></span></a>
    </div>
    <p class="m-section-title">Anteriores</p>
    <div class="card list">
      <a href="#M10" class="notif-read"><span class="icotile muted">${I('remove_circle')}</span><span class="grow"><span class="title">Adiantamento não liberado</span><br><span class="meta">Não houve produção registrada em 04/09.</span><br><span class="meta num">05/09/2026 15:01 · Adiantamento</span></span></a>
    </div>`, clock: '18:05' }),
    ['Histórico persistente (NotificacaoMotorista) com lida/não lida, independente do push.', 'Avisos do hub entram para todo o público escolhido, inclusive quem não ativou push (D-15).', 'Tocar abre o deep link (allowlist) e marca como lida. Data e hora no fuso da configuração.'],
    'PLANO §12.6, §19 · D-15, Q-N6, Q-N7');

  add('M03', 'm', 'Adiantamento disponível', () => phone({ title: 'Adiantamento', nav: 'adv', body: `
    <div class="row between">${pill('ok', 'check_circle', 'Disponível hoje')}<span class="muted num" style="font-size:.8rem">até 15:00</span></div>
    <div class="card pad stack">
      <div><div class="eyebrow">Produção considerada</div><div style="font-weight:700">Sua solicitação de hoje usa a produção de ontem, quarta-feira, 16/09.</div></div>
      ${breakdown(false)}
      <div class="alert"><span class="ms" aria-hidden="true">info</span><p>O valor final é calculado às 15:00, com a produção importada até lá.</p></div>
    </div>
    <div class="card pad stack">
      <div class="eyebrow">Conta de destino</div>
      ${contaMask}
      <a class="link" href="#M12">Ver ou alterar dados bancários</a>
    </div>
    <div class="card pad stack">
      <div class="row between"><span class="eyebrow">Dias disponíveis</span><span class="muted" style="font-size:.78rem">09:00 às 15:00</span></div>

      <div class="muted" style="font-size:.8rem">Pagamento previsto: entre 17h e 18h de hoje. Uma solicitação por dia.</div>
    </div>
    <a class="btn block" href="#M06">Solicitar adiantamento</a>
    <a class="btn ghost block" href="#M15">${I('help')}Como funciona</a>` }),
    ['Tudo vem de GET /motorista/adiantamento/disponibilidade (canRequest, regras, estimativa, conta mascarada).', 'A estimativa só aparece quando a produção de ontem já foi importada (~11h10); antes disso o card diz que o valor sai às 15:00.', 'Percentual, taxa, dias, horários e previsão são da configuração vigente; o app não guarda regra.'],

  add('M04', 'm', 'Dia indisponível', () => phone({ title: 'Adiantamento', nav: 'adv', clock: '11:02', body: `
    <div class="row between">${pill('', 'event_busy', 'Indisponível hoje')}<span class="muted" style="font-size:.8rem">domingo, 20/09</span></div>
    <div class="card pad stack">
      <div class="row"><span class="icotile muted">${I('event_busy')}</span><div style="font-weight:800;font-size:1.05rem">Hoje não é um dia disponível para novas solicitações.</div></div>

      ${daysRow(0)}
      <div class="alert"><span class="ms" aria-hidden="true">event_available</span><p><strong>Próxima oportunidade</strong>segunda-feira, 21/09, das 09:00 às 15:00 — usando a produção de domingo.</p></div>

    <p class="m-section-title">Sua última solicitação</p>
    <a class="card list" href="#M09" style="text-decoration:none;color:inherit"><span class="row" style="padding:.8rem .9rem"><span class="icotile ok">${I('paid')}</span><span class="grow"><span class="title">Sábado, 19/09</span><br><span class="meta">R$ 131,20</span></span>${st('PAGA')}</span></a>

  add('M05', 'm', 'Prazo encerrado', () => phone({ title: 'Adiantamento', nav: 'adv', clock: '15:12', body: `

  pick.addEventListener('change', () => { location.hash = pick.value; });

  const stage = document.getElementById('stage');
  function show() {
    const id = (location.hash || '#M01').slice(1);

    const next = S[(i + 1) % S.length];
    document.getElementById('scr-id').textContent = s.id;
    document.getElementById('scr-title').textContent = s.title;
    document.getElementById('scr-app').textContent = s.app === 'm' ? '· App do motorista' : '· Hub';
    pick.value = s.id;
    idx.querySelectorAll('a').forEach((a) => {
      if (a.dataset.id === s.id) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    const notes = `<aside class="notes"><h3>O que esta tela decide</h3><ul>${s.notes.map((n) => `<li>${n}</li>`).join('')}</ul><p class="refs">${s.refs}</p>
      <div class="navpair"><a class="btn outline sm" href="#${prev.id}">${I('arrow_back')}${prev.id}</a><a class="btn outline sm" href="#${next.id}">${next.id}${I('arrow_forward')}</a></div></aside>`;
    stage.innerHTML = s.app === 'm' ? s.render() + notes : `<div style="flex:1 1 100%;min-width:0">${s.render()}</div>` + notes;
    const f = stage.querySelector('.focus-ring');
    if (f) f.scrollIntoView({ block: 'center' });
    else if (window.scrollY > 0 && document.activeElement?.closest('.index, .navpair')) window.scrollTo({ top: 0 });
  }

  const root = document.documentElement;
  document.getElementById('theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });
})();
</script>
