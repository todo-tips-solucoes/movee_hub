# DESTINO NO HOST: /etc/ssh/sshd_config.d/01-hardening.conf
#
# Endurecimento do SSH — VPSTodo, 2026-08-30.
#
# ⚠️ O PREFIXO 01 É PARTE DA CORREÇÃO: no sshd a PRIMEIRA diretiva encontrada
# vence, e os drop-ins são lidos em ordem alfabética. Com o nome `99-`, o
# `50-cloud-init.conf` (que traz `PasswordAuthentication yes`) era lido antes e
# ganhava — o reload dizia OK e a senha continuava ligada. Verificado com
# `sshd -T` em 2026-08-30. NÃO renomear para um número acima de 50.
#
# Motivo: 7.757 tentativas de login falhadas no auth.log, 1.823 delas contra
# `root`, com o servidor aceitando senha. O fail2ban (jail.local) desacelera o
# ataque; isto fecha o vetor.
#
# `prohibit-password` e NÃO `no`: o operador administra este host COMO root, e
# `PermitRootLogin no` bloquearia inclusive a chave — lockout. Aqui: chave sim,
# senha não. Antes de aplicar, CONFIRME no auth.log que existe um
# `Accepted publickey` recente para root — sem isso, isto é um lockout.
PermitRootLogin prohibit-password

# Sem estas duas, o PAM ainda aceitaria senha por outro caminho.
PasswordAuthentication no
KbdInteractiveAuthentication no

# 6 tentativas por conexão era folga demais para quem só usa chave.
MaxAuthTries 3
