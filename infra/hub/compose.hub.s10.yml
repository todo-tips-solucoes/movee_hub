# =============================================================================
# Hub de Gestão de Frota — ambiente S10 (ensaio de migrations + carga)
#
# Clone de compose.hub.test.yml com UMA diferença estrutural: o banco usa um
# volume nomeado EM DISCO (não tmpfs) — os números de tempo de migration e de
# REFRESH de MV sobre ~2,5M linhas precisam pagar I/O real, como o postgres:13
# de produção (volume pgadmin_pg_data em disco). Limites de memória/cpu do db
# também são maiores que os do TEST (que só carrega dezenas de linhas).
#
# Projeto SEMPRE prefixado hub- (ex.: hub-s10-<runid>) — exigência da exceção
# escopada G1; o volume herda o prefixo do projeto e morre no down -v.
#
# Comando canônico:
#   RUNID=$(date +%s)
#   docker compose -f infra/hub/compose.hub.s10.yml -p hub-s10-$RUNID \
#     --env-file /var/lib/hub_secrets/.env.hub.test up -d
#   ... ensaio (infra/hub/testes/ensaio-migrations-s10.sh faz isso) ...
#   docker compose -f infra/hub/compose.hub.s10.yml -p hub-s10-$RUNID down -v
# =============================================================================

x-hub-common: &hub-common
  labels:
    com.moveelog.env: "${APP_ENV:?APP_ENV obrigatorio}"
    com.moveelog.project: "hub"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "1"

services:
  db:
    <<: *hub-common
    image: postgres:13
    mem_limit: 2g
    cpus: 2
    environment:
      POSTGRES_DB: "${HUB_DB_NAME:?}"
      POSTGRES_USER: "${HUB_DB_USER:?}"
      POSTGRES_PASSWORD: "${HUB_DB_PASSWORD:?}"
      APP_ENV: "${APP_ENV}"
    volumes:
      - pgdata_s10:/var/lib/postgresql/data   # DISCO (ver cabeçalho)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DB_USER} -d ${HUB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    <<: *hub-common
    image: postgrest/postgrest:v14.1
    mem_limit: 256m
    cpus: 0.5
    environment:
      PGRST_DB_URI: "postgres://${HUB_DB_USER}:${HUB_DB_PASSWORD}@db:5432/${HUB_DB_NAME}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "hub_web_anon"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?}"
      PGRST_SERVER_PORT: "3000"
      APP_ENV: "${APP_ENV}"
    depends_on:
      db:
        condition: service_healthy

  fastapi-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/fastapi-mock:/app:ro
    tmpfs:
      - /data

  n8n-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/n8n-mock:/app:ro
    tmpfs:
      - /data

  mailpit-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/mailpit-like:/app:ro
    tmpfs:
      - /data

  backend:
    <<: *hub-common
    build:
      context: ../../app_homologacao/backend
      dockerfile: Dockerfile.hub
    mem_limit: 512m
    cpus: 1
    environment:
      APP_ENV: "${APP_ENV}"
      POSTGREST_URL: "http://postgrest:3000"
      POSTGREST_API_KEY: "${POSTGREST_API_KEY:?}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?}"
      JWT_SECRET: "${JWT_SECRET:?}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?}"
      FASTAPI_URL: "${FASTAPI_URL}"
      FASTAPI_NEXUS_URL: "${FASTAPI_NEXUS_URL:-${FASTAPI_URL}}"
      N8N_URL: "${N8N_URL}"
      MAIL_MOCK_URL: "${MAIL_MOCK_URL}"
      # issue #62: gate de saída externa do fluxo legado (lib/envio-gate.js).
      # Default fail-safe TRUE nos ambientes do hub; produção NUNCA define
      # estas vars (gate inerte = comportamento histórico).
      ENVIO_DRY_RUN: "${ENVIO_DRY_RUN:-true}"
      ENVIO_ALLOWLIST: "${ENVIO_ALLOWLIST:-}"
      HUB_RBAC_ENVIO: "${HUB_RBAC_ENVIO:-}"
      HUB_IMPORT_LOG_ENVIO: "${HUB_IMPORT_LOG_ENVIO:-}"
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started

volumes:
  pgdata_s10:
