# =============================================================================
# Hub de Gestão de Frota — ambiente TEST (efêmero, Alternativa C §4.3)
# Um projeto descartável POR EXECUÇÃO de suíte; banco em tmpfs; sem portas
# publicadas; nomes derivados do projeto (sem container_name/name fixos, para
# permitir execuções paralelas).
#
# Comando canônico (RUNID único por execução):
#   RUNID=$(date +%s)
#   docker compose -f infra/hub/compose.hub.test.yml -p hub-test-$RUNID \
#     --env-file /var/lib/hub_secrets/.env.hub.test up -d
#   ... roda a suíte ...
#   docker compose -f infra/hub/compose.hub.test.yml -p hub-test-$RUNID down -v
# =============================================================================

x-hub-common: &hub-common
  labels:
    com.moveelog.env: "${APP_ENV:?APP_ENV obrigatorio}"
    com.moveelog.project: "hub"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "1"

services:
  db:
    <<: *hub-common
    image: postgres:13
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_DB: "${HUB_DB_NAME:?}"
      POSTGRES_USER: "${HUB_DB_USER:?}"
      POSTGRES_PASSWORD: "${HUB_DB_PASSWORD:?}"
      APP_ENV: "${APP_ENV}"
    tmpfs:
      - /var/lib/postgresql/data   # efêmero: nada persiste após down -v
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DB_USER} -d ${HUB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    <<: *hub-common
    image: postgrest/postgrest:v14.1
    mem_limit: 256m
    cpus: 0.5
    environment:
      PGRST_DB_URI: "postgres://${HUB_DB_USER}:${HUB_DB_PASSWORD}@db:5432/${HUB_DB_NAME}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "hub_web_anon"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?}"
      PGRST_SERVER_PORT: "3000"
      APP_ENV: "${APP_ENV}"
    depends_on:
      db:
        condition: service_healthy

  fastapi-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/fastapi-mock:/app:ro
    tmpfs:
      # os mocks gravam evidência em /data/*.jsonl; sem isto o appendFileSync
      # falharia (ENOENT engolido) e GET /_log voltaria vazio (review S1)
      - /data

  n8n-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/n8n-mock:/app:ro
    tmpfs:
      - /data

  mailpit-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/mailpit-like:/app:ro
    tmpfs:
      - /data

  backend:
    <<: *hub-common
    build:
      context: ../../app_homologacao/backend
      dockerfile: Dockerfile.hub
    mem_limit: 512m
    cpus: 0.5
    environment:
      APP_ENV: "${APP_ENV}"
      POSTGREST_URL: "http://postgrest:3000"
      POSTGREST_API_KEY: "${POSTGREST_API_KEY:?}"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?}"
      JWT_SECRET: "${JWT_SECRET:?}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?}"
      FASTAPI_URL: "${FASTAPI_URL}"
      FASTAPI_NEXUS_URL: "${FASTAPI_NEXUS_URL:-${FASTAPI_URL}}"
      N8N_URL: "${N8N_URL}"
      MAIL_MOCK_URL: "${MAIL_MOCK_URL}"
      # issue #62: gate de saída externa do fluxo legado (lib/envio-gate.js).
      # Default fail-safe TRUE nos ambientes do hub; produção NUNCA define
      # estas vars (gate inerte = comportamento histórico).
      ENVIO_DRY_RUN: "${ENVIO_DRY_RUN:-true}"
      ENVIO_ALLOWLIST: "${ENVIO_ALLOWLIST:-}"
      # hub-envio-massa (S8): flags reversíveis instantâneas (research.md
      # Decision 6/FR-006, FR-010) — lidas por request pelo middleware, sem
      # cache; alterar aqui exige recreate do container p/ efeito. Default
      # (não setada) = comportamento ligado.
      HUB_RBAC_ENVIO: "${HUB_RBAC_ENVIO:-}"
      HUB_IMPORT_LOG_ENVIO: "${HUB_IMPORT_LOG_ENVIO:-}"
      # hub-importacoes FASE 4 (tasks.md 4.6.3) — janela OPCIONAL de teste
      # entre lotes do processador (lib/hub-import-processor.js), usada
      # SOMENTE por infra/hub/testes/hub-import-processor-integration.sh
      # para observar cancelamento real entre 2 lotes de um arquivo grande.
      # Default 0 = no-op (idêntico ao comportamento de produção/dev, que
      # não define esta var). NUNCA presente em compose.hub.dev.yml/
      # compose.hub.homolog.yml.
      HUB_IMPORT_TEST_LOTE_DELAY_MS: "${HUB_IMPORT_TEST_LOTE_DELAY_MS:-0}"
      # hub-motorista-canonico FASE 5 (tasks.md 5.4, lib/hub-motorista-app-login.js)
      # — gate de ambiente do login do app motorista contra ContaMotorista
      # canônica em vez da tabela Motorista legada. Default (não setada) =
      # comportamento legado idêntico (byte-a-byte) — mesmo espírito de
      # ENVIO_DRY_RUN acima. Usada SOMENTE por
      # infra/hub/testes/hub-motorista-canonico-credencial-integration.sh
      # (exporta HUB_MOTORISTA_LOGIN_CONTA_ATIVA=true no shell antes do `up`
      # para exercitar o fluxo novo) — NUNCA presente em
      # compose.hub.dev.yml/compose.hub.homolog.yml nesta fase (rollout real
      # para hub-homolog fica para além da FASE 5, smoke manual pendente).
      HUB_MOTORISTA_LOGIN_CONTA_ATIVA: "${HUB_MOTORISTA_LOGIN_CONTA_ATIVA:-}"
    depends_on:
      db:
        condition: service_healthy
      postgrest:
        condition: service_started

# Rede default do projeto (hub-test-<runid>_default) — prefixo hub- garantido
# pelo nome do projeto; volumes não são usados (tmpfs).
