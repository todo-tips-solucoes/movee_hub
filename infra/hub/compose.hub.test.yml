# =============================================================================
# Hub de Gestão de Frota — ambiente TEST (efêmero, Alternativa C §4.3)
# Um projeto descartável POR EXECUÇÃO de suíte; banco em tmpfs; sem portas
# publicadas; nomes derivados do projeto (sem container_name/name fixos, para
# permitir execuções paralelas).
#
# Comando canônico (RUNID único por execução):
#   RUNID=$(date +%s)
#   docker compose -f infra/hub/compose.hub.test.yml -p hub-test-$RUNID \
#     --env-file /var/lib/hub_secrets/.env.hub.test up -d
#   ... roda a suíte ...
#   docker compose -f infra/hub/compose.hub.test.yml -p hub-test-$RUNID down -v
# =============================================================================

x-hub-common: &hub-common
  labels:
    com.moveelog.env: "${APP_ENV:?APP_ENV obrigatorio}"
    com.moveelog.project: "hub"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "1"

services:
  db:
    <<: *hub-common
    image: postgres:13
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_DB: "${HUB_DB_NAME:?}"
      POSTGRES_USER: "${HUB_DB_USER:?}"
      POSTGRES_PASSWORD: "${HUB_DB_PASSWORD:?}"
      APP_ENV: "${APP_ENV}"
    tmpfs:
      - /var/lib/postgresql/data   # efêmero: nada persiste após down -v
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HUB_DB_USER} -d ${HUB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    <<: *hub-common
    image: postgrest/postgrest:v14.1
    mem_limit: 256m
    cpus: 0.5
    environment:
      PGRST_DB_URI: "postgres://${HUB_DB_USER}:${HUB_DB_PASSWORD}@db:5432/${HUB_DB_NAME}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "hub_web_anon"
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:?}"
      PGRST_SERVER_PORT: "3000"
      APP_ENV: "${APP_ENV}"
    depends_on:
      db:
        condition: service_healthy

  fastapi-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/fastapi-mock:/app:ro

  n8n-mock:
    <<: *hub-common
    image: node:20-alpine
    mem_limit: 128m
    cpus: 0.25
    command: ["node", "/app/server.js"]
    environment:
      APP_ENV: "${APP_ENV}"
      MOCK_PORT: "8080"
    volumes:
      - ./mocks/n8n-mock:/app:ro

# Rede default do projeto (hub-test-<runid>_default) — prefixo hub- garantido
# pelo nome do projeto; volumes não são usados (tmpfs).
